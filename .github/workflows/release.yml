name: release

# Builds the release archives as workflow artifacts; it never publishes. A tag v* or "Run workflow" runs it, and the
# artifacts are the CI check that a release still builds and packages.
#
# The macOS release itself is signed with the maintainer's Developer ID certificate and notarized, which only works on
# the machine that holds the certificate: run tools/release/release.sh there (it creates a DRAFT GitHub release). The
# macOS archive below is ad-hoc signed and only proves the packaging works. No archive contains game data: the game
# reads the user's own disc images when it starts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target parasite-eve-ii-pc
      - name: Package (ad-hoc signed)
        run: |
          version=${GITHUB_REF_NAME:-dev}
          version=${version#v}
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
          archive=$(tools/release/package_app.sh build/parasite-eve-ii-pc "$version" dist "" save-editor/target/release/pe2-save-editor | tail -n1)
          (cd dist && shasum -a 256 "$(basename "$archive")" > SHA256SUMS)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            ${{ env.ARCHIVE }}
            dist/SHA256SUMS

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdecor-0-dev libvulkan-dev libxtst-dev libxinerama-dev wayland-protocols libdrm-dev libgbm-dev libgles2-mesa-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: No game data in the repository
        run: tools/ci/check_no_game_data.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target parasite-eve-ii-pc
      - name: Package
        run: |
          version=${GITHUB_REF_NAME:-dev}
          version=${version#v}
          name=Parasite-Eve-II-${version}-linux-x86_64
          mkdir -p "dist/$name"
          cp build/parasite-eve-ii-pc "dist/$name/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md "dist/$name/"
          ldd build/parasite-eve-ii-pc > "dist/$name/runtime-dependencies.txt"
          git rev-parse HEAD > "dist/$name/source-commit.txt"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ env.ARCHIVE }}
            dist/SHA256SUMS

  save-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the save editor
        run: |
          cargo test --manifest-path save-editor/Cargo.toml --locked
          cargo build --manifest-path save-editor/Cargo.toml --locked --release
